<!doctype html>
<html lang="uk" data-color-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Nexus GymB — програми та щоденник тренувань." />
    <title>Вхід та реєстрація — Nexus GymB</title>
    <link rel="icon" href="favicon.svg" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" data-auth-style />
  </head>
  <body data-page="login">
    <div id="app"><main class="loading">Завантаження Nexus GymB…</main></div>
    <script>
      try {
        if (localStorage.getItem('nexus:auth-language') === 'en') {
          document.documentElement.lang = 'en';
          document.title = 'Sign in — Nexus GymB';
          document.querySelector('.loading').textContent = 'Loading Nexus GymB…';
        }
      } catch {}
    </script>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"></dialog>
    <noscript>Для роботи Nexus GymB увімкни JavaScript. Enable JavaScript to use Nexus GymB.</noscript>
    <script type="module" src="js/start.js"></script>
  </body>
</html>
